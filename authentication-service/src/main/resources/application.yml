server:
  port: 8081

spring:
  application:
    name: authentication-service
  
  # PostgreSQL R2DBC configuration for reactive database access
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/crediya_auth
    username: crediya_user
    password: crediya_password
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  # Database initialization
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

# Logging configuration for monitoring and tracing
logging:
  level:
    com.crediya: DEBUG
    org.springframework.r2dbc: DEBUG
    io.r2dbc: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator endpoints for health checks and monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# OpenAPI/Swagger configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
